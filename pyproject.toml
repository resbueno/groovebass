[project]
name = "groovebass"
version = "0.1.0"
description = "Partitura, tablatura (4 ou 5 cordas) e cifra de baixo a partir de uma música"
requires-python = ">=3.10"
# Roda dentro da imagem do Kicksnare: reaproveita dele login, download, Demucs, beats e partes.
dependencies = [
    "torchcrepe==0.0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["groovebass"]

[tool.setuptools.package-data]
groovebass = ["static/*"]
