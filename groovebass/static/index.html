<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groovebass</title>
<link rel="icon" type="image/png" href="__BASE__/static/favicon.png">
<link rel="apple-touch-icon" href="__BASE__/static/apple-touch-icon.png">
<meta name="theme-color" content="#16181d">
<link rel="stylesheet" href="__BASE__/static/base.css?v=6">
</head>
<body>
<header class="brandbar"><div class="in"><a href="__BASE__/" aria-label="Groovebass — início"><img src="__BASE__/static/logo.png" alt="Groovebass — partitura e linhas de baixo" width="243" height="46"></a></div></header>
<main>
  <h1>Groovebass</h1>
  <p class="lead">Cole um link do YouTube ou envie um arquivo de áudio. O baixo é isolado e vira partitura, tablatura (4 ou 5 cordas) e cifra.</p>

  <div class="panel">
    <form id="add" class="row">
      <input type="url" id="url" placeholder="https://www.youtube.com/watch?v=..." required>
      <button class="primary" type="submit">Adicionar</button>
    </form>
    <div class="row" style="margin-top:14px">
      <span class="muted small">ou</span>
      <label class="btn sm" for="file">Enviar arquivo de áudio</label>
      <input id="file" type="file" accept="audio/*,video/*" hidden>
      <span id="msg" class="muted small"></span>
    </div>
  </div>

  <div class="search" style="margin-top:48px">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="q" placeholder="Pesquisar por música, banda ou termo…" aria-label="Pesquisar músicas"
      autocomplete="off" spellcheck="false">
    <span id="qCount" class="muted small" aria-live="polite"></span>
    <kbd id="qKey" title="Atalho para pesquisar">/</kbd>
  </div>
  <div class="row" style="justify-content:space-between;margin:20px 0 16px">
    <h2 style="margin:0">Músicas</h2>
    <span class="row">
      <label class="muted small">Organizar
        <select id="group">
          <option value="artist">Letra → Banda</option>
          <option value="title">Letra → Música</option>
          <option value="flat">Lista simples</option>
        </select>
      </label>
      <label class="muted small"><input type="checkbox" id="mine">só as minhas</label>
    </span>
  </div>
  <div class="panel" id="list"><span class="muted">Carregando…</span></div>
</main>
<script src="__BASE__/static/auth.js" data-base="__BASE__" data-ks="/kicksnare"></script>
<script>
const BASE = "__BASE__";
const $ = (s) => document.querySelector(s);
const STAGES = { ingest: "baixando", separate: "isolando baixo", transcribe: "transcrevendo", finalize: "finalizando" };

// "pronto em ~4 min (14:32)"; abaixo de 1 min vira "menos de 1 min"
function etaText(e) {
  const m = Math.round(e.seconds / 60);
  const quando = new Date(e.finish_at * 1000).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  const dur = e.seconds < 45 ? "menos de 1 min" : (m >= 60 ? `~${Math.floor(m / 60)} h ${m % 60} min` : `~${m} min`);
  return `pronta em ${dur} (${quando})` + (e.calibrated ? "" : " · estimativa inicial");
}

function fmt(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + "m" + String(sec % 60).padStart(2, "0") + "s"; }

const collator = new Intl.Collator("pt-BR", { sensitivity: "base", numeric: true });
const letterOf = (t) => {
  const c = (t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().charAt(0).toUpperCase();
  return /[A-Z]/.test(c) ? c : "#";
};
const heading = (text, tag) => { const h = document.createElement(tag); h.textContent = text; h.style.margin = tag === "h3" ? "14px 0 4px" : "6px 0 2px"; return h; };

const norm = (t) => (t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
let allSongs = [];

function render(all) {
  allSongs = all;
  const list = $("#list");
  if (!all.length) { list.innerHTML = '<span class="muted">Nenhuma música ainda.</span>'; return; }
  const terms = norm($("#q").value).split(/\s+/).filter(Boolean);   // todos os termos precisam aparecer
  const songs = terms.length
    ? all.filter((s) => { const hay = norm([s.title, s.artist, s.owner].join(" ")); return terms.every((t) => hay.includes(t)); })
    : all;
  $("#qCount").textContent = terms.length ? `${songs.length} de ${all.length}` : "";
  if (!songs.length) { list.innerHTML = '<span class="muted">Nenhuma música encontrada para essa pesquisa.</span>'; return; }
  const mode = $("#group").value;
  const name = (s) => s.title || s.source || "";
  if (mode === "flat") { list.replaceChildren(...songs.map(songRow)); return; }
  // Letra → (banda →) músicas; sem banda cai em "Sem banda" (ordenado por nome da música)
  const key = (s) => (mode === "artist" ? (s.artist || "") : name(s));
  const sorted = [...songs].sort((a, b) => {
    if (mode === "artist" && !a.artist !== !b.artist) return a.artist ? -1 : 1;
    return collator.compare(key(a), key(b)) || collator.compare(name(a), name(b));
  });
  const out = []; let curLetter = null, curBand = null, box = null;
  for (const s of sorted) {
    const noBand = mode === "artist" && !s.artist;
    const L = noBand ? "—" : letterOf(key(s));
    if (L !== curLetter) { curLetter = L; curBand = null; box = null; out.push(heading(noBand ? "Sem banda" : L, "h3")); }
    if (mode === "artist" && !noBand && s.artist !== curBand) {
      curBand = s.artist;
      box = bandBox(s.artist, songs.filter((x) => x.artist === s.artist).length, terms.length > 0);
      out.push(box);
    }
    (box || { append: (r) => out.push(r) }).append(songRow(s));
  }
  list.replaceChildren(...out);
}

// acordeão por banda; o que está aberto sobrevive à atualização da lista (e ao recarregar a página)
let openBands = new Set();
try { openBands = new Set(JSON.parse(localStorage.getItem("gb-open-bands") || "[]")); } catch {}
function bandBox(band, count, searching) {
  const d = document.createElement("details"); d.className = "band";
  d.open = searching || openBands.has(band);       // pesquisando: tudo aberto para mostrar os resultados
  const sm = document.createElement("summary");
  const n = document.createElement("span"); n.className = "muted small"; n.textContent = ` ${count}`;
  sm.append(band, n); d.append(sm);
  d.addEventListener("toggle", () => {
    if (searching) return;
    d.open ? openBands.add(band) : openBands.delete(band);
    try { localStorage.setItem("gb-open-bands", JSON.stringify([...openBands])); } catch {}
  });
  return d;
}

function songRow(s) {
  {
    const row = document.createElement("div"); row.className = "song";
    const left = document.createElement("div");
    const title = document.createElement(s.status === "done" ? "a" : "span");
    title.className = "title"; title.textContent = s.title || s.source;
    if (s.artist && $("#group").value !== "artist") {
      const ar = document.createElement("span"); ar.className = "muted"; ar.textContent = " — " + s.artist; left.append(title, ar);
    }
    if (s.status === "done") title.href = BASE + "/songs/" + encodeURIComponent(s.id);
    if (!left.contains(title)) left.append(title);
    const meta = document.createElement("div"); meta.className = "muted";
    meta.style.fontSize = ".85rem";
    if (s.owner && (isAdmin || !s.can_edit)) {
      const o = document.createElement("span"); o.className = "chip"; o.textContent = "de " + s.owner;
      o.style.marginRight = "8px"; left.append(o);
    }
    if (s.shared && s.can_edit) {
      const o = document.createElement("span"); o.className = "chip ok"; o.textContent = "compartilhada";
      o.title = "Os outros usuários podem ver, ouvir e baixar"; o.style.marginRight = "8px"; left.append(o);
    }
    if (s.status === "done" && s.stats) {
      meta.textContent = `${s.stats.bars} compassos · ${Math.round(s.stats.bpm_median)} BPM`;
    } else if (s.status === "running") {
      meta.textContent = (s.message || "Processando") + " · " + fmt(Date.now() / 1000 - s.started) +
        (s.eta ? " · " + etaText(s.eta) : "");
    } else if (s.status === "queued") {
      meta.textContent = "Na fila" + (s.eta ? " · " + (s.eta.queue_ahead ? `${s.eta.queue_ahead} na frente · ` : "") + etaText(s.eta) : "");
    }
    left.append(meta);
    if (s.status === "running" && s.eta) {
      const bar = document.createElement("div"); bar.className = "etabar";
      const fill = document.createElement("div"); fill.style.width = Math.round(100 * s.eta.progress) + "%";
      bar.append(fill); left.append(bar);
    }
    if (s.status === "error") {
      const e = document.createElement("div"); e.className = "err-text"; e.textContent = s.error || "Erro";
      left.append(e);
    }
    const right = document.createElement("div"); right.className = "row";
    const chip = document.createElement("span");
    chip.className = "chip " + ({ done: "ok", error: "err", running: "warn" }[s.status] || "");
    chip.textContent = { done: "pronto", error: "erro", running: STAGES[s.stage] || "processando", queued: "na fila" }[s.status];
    right.append(chip);
    row.append(left, right);
    if (!s.can_edit) return row;                 // música de outro usuário: só abrir
    if (s.status === "done") {
      const sh = document.createElement("button");
      sh.textContent = s.shared ? "Tornar privada" : "Compartilhar";
      sh.title = s.shared ? "Só você volta a ver esta música" : "Deixa os outros usuários verem, ouvirem e baixarem (sem alterar)";
      sh.onclick = async () => {
        const r = await fetch(`${BASE}/api/songs/${encodeURIComponent(s.id)}/share`, { method: "POST",
          headers: { "Content-Type": "application/json" }, body: JSON.stringify({ shared: !s.shared }) });
        if (!r.ok) { try { alert((await r.json()).detail); } catch {} }
        load();
      };
      right.append(sh);
    }
    const rn = document.createElement("button"); rn.textContent = "Editar";
    rn.onclick = () => {
      const t = document.createElement("input"); t.type = "text"; t.maxLength = 120; t.value = s.title || "";
      t.placeholder = "Nome da música";
      const a = document.createElement("input"); a.type = "text"; a.maxLength = 120; a.value = s.artist || "";
      a.placeholder = "Banda / autor";
      const wrap = document.createElement("div"); wrap.className = "row"; wrap.style.margin = "4px 0";
      for (const i of [t, a]) i.style.cssText = "flex:1 1 200px;min-width:0";
      const ok = document.createElement("button"); ok.textContent = "Salvar"; ok.className = "primary";
      const cancel = document.createElement("button"); cancel.textContent = "Cancelar";
      const save = async () => {
        const body = {};
        if (t.value.trim() && t.value.trim() !== (s.title || "")) body.title = t.value.trim();
        if (a.value.trim() !== (s.artist || "")) body.artist = a.value.trim();
        if (Object.keys(body).length) {
          const r = await fetch(`${BASE}/api/songs/${encodeURIComponent(s.id)}`, { method: "PATCH",
            headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
          if (!r.ok) { try { alert((await r.json()).detail); } catch {} }
        }
        renaming = false; load();
      };
      ok.onclick = save; cancel.onclick = () => { renaming = false; load(); };
      wrap.addEventListener("keydown", (e) => { if (e.key === "Enter") save(); if (e.key === "Escape") { renaming = false; load(); } });
      wrap.append(t, a, ok, cancel);
      title.replaceWith(wrap); t.focus(); t.select(); renaming = true;
    };
    right.append(rn);
    if (s.status !== "running") {
      const d = document.createElement("button"); d.textContent = "Apagar"; d.className = "danger";
      let armed = false;
      d.onclick = async () => {
        if (!armed) { armed = true; d.textContent = "Confirmar?"; setTimeout(() => { armed = false; d.textContent = "Apagar"; }, 4000); return; }
        const r = await fetch(`${BASE}/api/songs/${encodeURIComponent(s.id)}`, { method: "DELETE" });
        if (!r.ok) { try { alert((await r.json()).detail); } catch {} }
        load();
      };
      right.append(d);
    }
    if (s.status === "error") {
      const b = document.createElement("button"); b.textContent = "Tentar de novo";
      b.onclick = async () => { await fetch(`${BASE}/api/songs/${s.id}/retry`, { method: "POST" }); load(); };
      right.append(b);
    }
    return row;
  }
}

async function load() {
  try { render(await (await fetch(BASE + "/api/songs" + ($("#mine").checked ? "?mine=1" : ""))).json()); } catch (e) { $("#list").textContent = "Falha ao carregar: " + e; }
}

$("#add").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("#msg").textContent = "";
  const r = await fetch(BASE + "/api/songs", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url: $("#url").value }) });
  if (!r.ok) { $("#msg").textContent = (await r.json()).detail || "Erro"; return; }
  $("#url").value = ""; load();
});

$("#file").addEventListener("change", async (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  $("#msg").textContent = "Enviando " + f.name + "…";
  const fd = new FormData(); fd.append("file", f);
  const r = await fetch(BASE + "/api/upload", { method: "POST", body: fd });
  $("#msg").textContent = r.ok ? "" : ((await r.json()).detail || "Erro no envio");
  ev.target.value = ""; load();
});

let isAdmin = false, renaming = false;
fetch(BASE + "/api/auth/me").then((r) => r.json()).then((u) => {
  isAdmin = !!u.is_admin;
  load();
}).catch(() => {});
$("#mine").onchange = load;
$("#q").addEventListener("input", () => render(allSongs));
// "/" foca a pesquisa (fora de outros campos); Esc limpa
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
});
$("#q").addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#q").value) { $("#q").value = ""; render(allSongs); } });
try { $("#group").value = localStorage.getItem("gb-group") || "artist"; } catch {}
$("#group").onchange = () => { try { localStorage.setItem("gb-group", $("#group").value); } catch {} load(); };
load(); setInterval(() => { if (!renaming) load(); }, 3000);
</script>
</body>
</html>
